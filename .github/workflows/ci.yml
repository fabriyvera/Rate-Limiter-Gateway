name: gateway and lab validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test -race -cover ./...
        working-directory: gateway
  k6:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        algorithm: [fixed_window, token_bucket, sliding_window_log, sliding_window_counter]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
        env:
          ALGORITHM: ${{ matrix.algorithm }}
          LIMIT: '2'
          WINDOW: 2s
      - run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: docker compose run --rm k6 run /scripts/smoke.js
      - run: docker compose run --rm -e DURATION=3s -e RPS=20 k6 run /scripts/sustained.js
      - run: docker compose run --rm -e RPS=30 k6 run /scripts/burst.js
      - if: always()
        run: docker compose logs && docker compose down
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install k6 for real lab integration
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz -o /tmp/k6.tar.gz
          echo '5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87  /tmp/k6.tar.gz' | sha256sum -c -
          tar -xzf /tmp/k6.tar.gz -C /tmp
          echo /tmp/k6-v2.4.0-linux-amd64 >> "$GITHUB_PATH"
      - run: go test -race -v ./internal/lab
        working-directory: gateway
      - run: node --check gateway/internal/lab/web/app.js
